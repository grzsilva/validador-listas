<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Conferência de listas de presença</title>
<style>
:root{
  --bg:#f3f6f7;--cd:#fff;--tx:#17262b;--mu:#5b6b72;--bd:#d6dfe2;
  --ac:#0f6e7a;--ok:#146c3b;--okb:#d9f2e3;--er:#a61b1b;--erb:#fbe0e0;
  --wa:#8a5a00;--wab:#fcefc7;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f1719;--cd:#182326;--tx:#e6eef0;--mu:#93a5ab;--bd:#2b3a3f;
    --ac:#4cc3d1;--ok:#6fdc9c;--okb:#12341f;--er:#ff8d8d;--erb:#3a1717;
    --wa:#f5c451;--wab:#3a2d0b;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1719;--cd:#182326;--tx:#e6eef0;--mu:#93a5ab;--bd:#2b3a3f;
  --ac:#4cc3d1;--ok:#6fdc9c;--okb:#12341f;--er:#ff8d8d;--erb:#3a1717;
  --wa:#f5c451;--wab:#3a2d0b;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg);color:var(--tx);
  font:16px/1.5 Georgia,"Times New Roman",serif;
}
main{max-width:900px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.6rem;line-height:1.2;margin:8px 0 6px}
p.s{color:var(--mu);margin:0 0 18px;font-family:system-ui,sans-serif;font-size:.95rem}
label.dz{
  display:block;border:2px dashed var(--ac);border-radius:10px;padding:26px 16px;
  text-align:center;cursor:pointer;background:var(--cd);font-family:system-ui,sans-serif;
}
label.dz:hover{background:color-mix(in srgb,var(--ac) 7%,var(--cd))}
label.dz:focus-within{outline:3px solid var(--ac)}
label.dz input{position:absolute;opacity:0;width:1px;height:1px}
label.dz b{color:var(--ac)}
.card{
  background:var(--cd);border:1px solid var(--bd);border-radius:10px;
  margin-top:16px;overflow:hidden;font-family:system-ui,sans-serif;
}
.hd{padding:14px 16px;border-bottom:1px solid var(--bd)}
.hd h2{font:700 1rem Georgia,serif;margin:0 0 8px;word-break:break-word}
.bg{display:inline-block;padding:2px 10px;border-radius:99px;font-weight:700;font-size:.85rem}
.ok{background:var(--okb);color:var(--ok)}
.er{background:var(--erb);color:var(--er)}
.wa{background:var(--wab);color:var(--wa)}
dl{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;margin:10px 0 0;font-size:.9rem}
dt{color:var(--mu)}
dd{margin:0}
.sec{padding:12px 16px;border-bottom:1px solid var(--bd)}
.sec:last-child{border:0}
.sec h3{font-size:.95rem;margin:0 0 6px}
ul{margin:0;padding:0;list-style:none}
li{padding:4px 0 4px 26px;position:relative;font-size:.92rem}
li:before{position:absolute;left:0;font-weight:700}
li.ok:before{content:"✔";color:var(--ok)}
li.er:before{content:"✘";color:var(--er)}
li.wa:before{content:"!";color:var(--wa);left:6px}
li.ok,li.er,li.wa{background:none}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;font-family:system-ui,sans-serif}
button{
  border:1px solid var(--bd);background:var(--cd);color:var(--tx);
  border-radius:8px;padding:8px 12px;cursor:pointer;font:inherit;
}
button:hover{border-color:var(--ac)}
.small{font-size:.82rem;color:var(--mu)}
.date-note{font-family:system-ui,sans-serif;font-size:.9rem;margin-top:8px;color:var(--mu)}
.table-wrap{overflow:auto;margin-top:12px;border:1px solid var(--bd);border-radius:12px}
.calendar-table,.matrix{width:100%;border-collapse:collapse;font-size:.86rem;background:var(--bg)}
.calendar-table th,.calendar-table td,.matrix th,.matrix td{border-bottom:1px solid var(--bd);padding:8px 7px;text-align:center;white-space:nowrap}
.calendar-table th,.matrix thead th{position:sticky;top:0;background:var(--card);z-index:2}
.calendar-table th:first-child,.calendar-table td:first-child{position:sticky;left:0;background:var(--card);z-index:3}
.pill{display:inline-block;padding:3px 7px;border-radius:999px;font-size:.72rem;font-weight:700}
.pill.expected{background:rgba(45,125,255,.12);color:#2d7dff}
.pill.ok{background:rgba(46,160,67,.14);color:#2e8b57}
.pill.wa{background:rgba(220,160,0,.16);color:#a06b00}
.pill.er{background:rgba(210,50,50,.14);color:#b3261e}
.matrix .student-name{text-align:left;min-width:190px;position:sticky;left:0;background:var(--card);z-index:3}
.matrix thead .student-name{z-index:5}
.matrix th small{display:block;font-weight:400;opacity:.65;font-size:.68rem;margin-top:2px}
.matrix td{min-width:38px;font-weight:800}
.matrix td.present{background:rgba(46,160,67,.15);color:#24743d}
.matrix td.absent{background:rgba(210,50,50,.15);color:#a52222}
.matrix td.dash{background:rgba(150,150,150,.13);color:var(--mu)}
.matrix td.blank{background:rgba(220,160,0,.10);color:#a06b00}
.student-total{font-weight:800;position:sticky;right:0;background:var(--card)}
@media(max-width:800px){
  .calendar-table,.matrix{font-size:.78rem}
  .calendar-table th,.calendar-table td,.matrix th,.matrix td{padding:6px 5px}
  .matrix .student-name{min-width:150px}
}

.progress{margin-top:10px;height:6px;background:var(--bd);border-radius:99px;overflow:hidden}
.progress>span{display:block;height:100%;width:0;background:var(--ac);transition:width .2s}
@media(max-width:560px){
  main{padding:16px 10px 36px}
  dl{grid-template-columns:1fr}
  dt{margin-top:5px}
}
</style>
</head>
<body>
<main>
  <h1>Conferência de listas de presença</h1>
  <p class="s">
    Envie o PDF ou a imagem (foto/print) da lista. O sistema confere P/A nos dias da
    periodicidade e verifica as assinaturas digitais quando disponíveis. A análise
    acontece no seu navegador: os arquivos não são enviados nem salvos por este sistema.
  </p>

  <label class="dz" for="f">
    <input id="f" type="file" accept="application/pdf,image/*" multiple>
    <b>Escolher PDFs ou imagens</b> ou arrastar para cá
    <div class="small">PDF, PNG ou JPG</div>
  </label>

  <div id="out" aria-live="polite"></div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
'use strict';

if (window.pdfjsLib) {
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
}

const MES = [
  'janeiro','fevereiro','março','abril','maio','junho',
  'julho','agosto','setembro','outubro','novembro','dezembro'
];

const DIA = {
  domingo:0, segunda:1, terca:2, terça:2, quarta:3,
  quinta:4, sexta:5, sabado:6, sábado:6
};

const NS = ['domingo','segunda','terça','quarta','quinta','sexta','sábado'];

const BAD = /instrutor|coordenador|coord\.|assinad|verifique|documento|data:|gov|_{3}/i;

const norm = s => String(s || '')
  .normalize('NFD')
  .replace(/[\u0300-\u036f]/g,'')
  .toLowerCase()
  .replace(/\s+/g,' ')
  .trim();

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({
  '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'
}[c]));

const dm = d => String(d).padStart(2,'0');

function der(b, p) {
  const t = b[p];
  let l = b[p + 1];
  let h = 2;

  if (l === 128) {
    let q = p + 2;
    while (q + 1 < b.length && !(b[q] === 0 && b[q + 1] === 0)) {
      const n = der(b, q);
      if (!n || n.e <= q) throw new Error('Estrutura ASN.1 inválida.');
      q = n.e;
    }
    return { t, s:p+2, e:q, p, ind:1, ce:q };
  }

  if (l & 128) {
    const n = l & 127;
    if (n === 0 || p + 2 + n > b.length) throw new Error('Tamanho ASN.1 inválido.');
    l = 0;
    for (let i = 0; i < n; i++) l = l * 256 + b[p + 2 + i];
    h = 2 + n;
  }

  if (p + h + l > b.length) throw new Error('Objeto ASN.1 fora dos limites.');
  return { t, s:p+h, e:p+h+l, p };
}

function kids(b, n) {
  if (!n) return [];
  const a = [];
  const lim = n.ind ? n.ce : n.e;
  let p = n.s;

  while (p < lim) {
    const k = der(b, p);
    a.push(k);
    p = k.e;
  }
  return a;
}

function cnOf(b, name) {
  for (const set of kids(b, name)) {
    for (const seq of kids(b, set)) {
      const parts = kids(b, seq);
      const o = parts[0], v = parts[1];
      if (
        o && v && o.e - o.s === 3 &&
        b[o.s] === 0x55 && b[o.s+1] === 0x04 && b[o.s+2] === 0x03
      ) {
        let encoding = 'latin1';
        if (v.t === 0x1e) encoding = 'utf-16be';
        else if (v.t === 0x0c) encoding = 'utf-8';
        return new TextDecoder(encoding).decode(b.slice(v.s, v.e));
      }
    }
  }
  return '';
}

function signerName(hex) {
  try {
    const clean = hex.replace(/[^0-9a-f]/gi,'');
    const bytes = clean.match(/../g);
    if (!bytes) return '';

    const b = new Uint8Array(bytes.map(h => parseInt(h,16)));
    const root = der(b,0);
    const rootKids = kids(b,root);
    if (!rootKids[1]) return '';

    const signerSetContainer = kids(b,rootKids[1])[0];
    if (!signerSetContainer) return '';

    const signerEntries = kids(b,signerSetContainer);
    const cs = [];

    for (const c of signerEntries) {
      const cKidsContainer = kids(b,c)[0];
      if (!cKidsContainer) continue;

      const ch = kids(b,cKidsContainer);
      const o = ch[0] && ch[0].t === 0xA0 ? 1 : 0;

      if (!ch[o+2] || !ch[o+4]) continue;

      const key = n => Array.from(b.slice(n.p,n.e)).join(',');
      cs.push({
        iss:key(ch[o+2]),
        sub:key(ch[o+4]),
        cn:cnOf(b,ch[o+4])
      });
    }

    const leaf = cs.find(c => !cs.some(x => x !== c && x.iss === c.sub)) || cs[0];
    return leaf ? leaf.cn.replace(/:\s*\*\d+\s*$/,'').trim() : '';
  } catch {
    return '';
  }
}

function readSigs(buf) {
  const s = new TextDecoder('latin1').decode(buf);
  const out = [];
  const re = /\/Contents\s*<([0-9A-Fa-f]{200,})>/g;
  let m;

  while ((m = re.exec(s))) {
    try {
      const w = s.slice(
        Math.max(0,m.index-1200),
        Math.min(s.length,m.index+m[0].length+1200)
      );
      const d = /\/M\s*\(D:(\d{4})(\d{2})(\d{2})/.exec(w);
      const nome = signerName(m[1]);

      if (nome && !out.some(o => norm(o.nome) === norm(nome))) {
        out.push({
          nome,
          data:d ? `${d[3]}/${d[2]}/${d[1]}` : ''
        });
      }
    } catch {}
  }

  return out;
}

const loadJs = u => new Promise((ok,no) => {
  const e = document.createElement('script');
  e.src = u;
  e.onload = ok;
  e.onerror = () => no(new Error(
    'Não foi possível carregar o leitor de imagens (OCR). Verifique sua conexão com a internet.'
  ));
  document.head.appendChild(e);
});

async function ocrItems(cv) {
  if (!window.Tesseract) {
    await loadJs(
      'https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/6.0.0/tesseract.min.js'
    );
  }

  const w = await Tesseract.createWorker('por');
  let data;

  try {
    const result = await w.recognize(cv, {}, { blocks:true });
    data = result.data;
  } finally {
    await w.terminate();
  }

  const ws = data.words ||
    (data.blocks || []).flatMap(b =>
      (b.paragraphs || []).flatMap(p =>
        (p.lines || []).flatMap(l => l.words || [])
      )
    );

  const W = cv.width;
  const H = cv.height;
  const k = (W > H ? 842 : 595) / W;

  return ws
    .filter(x => x.text && x.text.trim())
    .map(x => ({
      s:x.text.trim(),
      x:x.bbox.x0*k,
      y:(H-x.bbox.y1)*k,
      w:(x.bbox.x1-x.bbox.x0)*k
    }));
}

async function imageToCanvas(file) {
  if ('createImageBitmap' in window) {
    const bm = await createImageBitmap(file);
    const k = Math.min(1, 2200 / bm.width);
    const cv = document.createElement('canvas');
    cv.width = Math.max(1, Math.round(bm.width*k));
    cv.height = Math.max(1, Math.round(bm.height*k));
    cv.getContext('2d',{willReadFrequently:true}).drawImage(
      bm,0,0,cv.width,cv.height
    );
    if (bm.close) bm.close();
    return cv;
  }

  const url = URL.createObjectURL(file);
  try {
    const img = new Image();
    await new Promise((resolve,reject) => {
      img.onload = resolve;
      img.onerror = () => reject(new Error('Não foi possível abrir a imagem.'));
      img.src = url;
    });

    const k = Math.min(1,2200/img.naturalWidth);
    const cv = document.createElement('canvas');
    cv.width = Math.max(1,Math.round(img.naturalWidth*k));
    cv.height = Math.max(1,Math.round(img.naturalHeight*k));
    cv.getContext('2d',{willReadFrequently:true}).drawImage(
      img,0,0,cv.width,cv.height
    );
    return cv;
  } finally {
    URL.revokeObjectURL(url);
  }
}

async function extract(file) {
  const buf = await file.arrayBuffer();

  if (/^image\//i.test(file.type)) {
    const cv = await imageToCanvas(file);
    return {
      items:await ocrItems(cv),
      sigs:null,
      ocr:1,
      img:1
    };
  }

  if (!window.pdfjsLib) {
    throw new Error('O leitor de PDF não foi carregado. Verifique a conexão com a internet.');
  }

  const pdf = await pdfjsLib.getDocument({
    data:buf.slice(0)
  }).promise;

  if (!pdf.numPages) throw new Error('O PDF não contém páginas.');

  /*
   * A lista pode ocupar mais de uma página. O código original lia apenas
   * a primeira. Agora reunimos o texto de todas as páginas e usamos OCR
   * página a página apenas quando necessário.
   */
  const allItems = [];
  const sigs = readSigs(buf);
  let usedOcr = false;

  for (let pageNo = 1; pageNo <= pdf.numPages; pageNo++) {
    const pg = await pdf.getPage(pageNo);
    const tc = await pg.getTextContent();

    const pageItems = tc.items
      .map(i => ({
        s:String(i.str || '').trim(),
        x:i.transform[4],
        y:i.transform[5],
        w:i.width || 0,
        page:pageNo
      }))
      .filter(i => i.s);

    /*
     * Se a página não tiver texto suficiente, renderizamos e aplicamos OCR.
     * A coordenada Y do PDF e do OCR é normalizada para um espaço semelhante.
     */
    if (pageItems.length >= 12) {
      allItems.push(...pageItems);
    } else {
      const vp = pg.getViewport({scale:2.6});
      const cv = document.createElement('canvas');
      cv.width = Math.ceil(vp.width);
      cv.height = Math.ceil(vp.height);

      await pg.render({
        canvasContext:cv.getContext('2d',{willReadFrequently:true}),
        viewport:vp
      }).promise;

      const ocr = await ocrItems(cv);
      ocr.forEach(i => i.page = pageNo);
      allItems.push(...ocr);
      usedOcr = true;
    }
  }

  return {
    items:allItems,
    sigs,
    ocr:usedOcr ? 1 : 0,
    img:0
  };
}

function val(items,re,multi,cut) {
  const candidates = items.filter(i => re.test(i.s)).sort((a,b) => b.y-a.y);
  const l = candidates[0];

  if (!l) return '';

  const m = l.s.match(re);
  if (m && m[1]) return m[1].trim();

  const bl = items
    .filter(i =>
      i !== l &&
      (
        /^(núcleo|nucleo|turma|modalidade|professor|coordenador|auxiliar):?$/i.test(i.s) ||
        /^(periodicidade|horário|horario):?$/i.test(i.s)
      ) &&
      i.x > l.x + l.w &&
      Math.abs(i.y-l.y) < 10
    )
    .map(i => i.x);

  const lim = Math.min(cut ?? 1e9,...bl);
  const x0 = l.x + l.w - 2;

  const n = items.filter(i =>
    i !== l &&
    i.x > x0 &&
    i.x < lim &&
    !/^20\d\d$/.test(i.s) &&
    Math.abs(i.y-l.y) < (multi ? 12 : 10)
  );

  if (multi) {
    return n
      .sort((a,b) => b.y-a.y || a.x-b.x)
      .map(i => i.s)
      .join(' ');
  }

  n.sort((a,b) =>
    Math.abs(a.y-l.y)-Math.abs(b.y-l.y) || a.x-b.x
  );

  if (!n[0]) return '';

  const dy = Math.abs(n[0].y-l.y);

  return n
    .filter(i => Math.abs(Math.abs(i.y-l.y)-dy) < 3)
    .sort((a,b) => a.x-b.x)
    .map(i => i.s)
    .join(' ');
}

function parseReference(items) {
  const monthMap = Object.fromEntries(
    MES.map((m,i) => [norm(m),i])
  );

  /*
   * Primeiro localizamos o mês. Depois procuramos o ano relacionado
   * espacialmente a esse mês. Isso evita confundir o ano do número do
   * convênio/projeto (ex.: 959182/2025) com o ano do calendário (2026).
   */
  let mItem = items.find(i => monthMap[norm(i.s)] !== undefined);
  let mi = mItem ? monthMap[norm(mItem.s)] : null;

  if (mi == null) {
    const joined = items.map(i => i.s).join(' ');

    const mm = joined.match(
      /\b(janeiro|fevereiro|março|marco|abril|maio|junho|julho|agosto|setembro|outubro|novembro|dezembro)\b/i
    );

    if (mm) {
      mi = monthMap[norm(mm[1])];
    } else {
      const numeric = joined.match(
        /\b(0?[1-9]|1[0-2])\s*[\/-]\s*(20\d{2})\b/
      );

      if (numeric) mi = Number(numeric[1])-1;
    }
  }

  const yearItems = items
    .map(i => {
      const m = String(i.s || '').match(/\b(20\d{2})\b/);
      return m
        ? {...i, year:Number(m[1])}
        : null;
    })
    .filter(Boolean);

  let ano = null;

  if (mItem && yearItems.length) {
    /*
     * O ano do calendário normalmente fica abaixo/acima do nome do mês
     * e com X muito próximo. Priorizamos distância horizontal e vertical.
     */
    const ranked = yearItems
      .map(y => {
        const mx = mItem.x + (mItem.w || 0)/2;
        const my = mItem.y;
        const yx = y.x + (y.w || 0)/2;
        const yy = y.y;

        const dx = Math.abs(yx-mx);
        const dy = Math.abs(yy-my);

        /*
         * Ano na mesma região visual recebe peso maior que ano distante.
         * Um ano em outro cabeçalho (como 2025 do número do processo)
         * fica naturalmente com pontuação pior.
         */
        const score = dx * 1.5 + dy;

        return {year:y.year,score,dx,dy};
      })
      .sort((a,b) => a.score-b.score);

    if (ranked[0]) ano = ranked[0].year;
  }

  /*
   * Fallback: se não houver uma associação espacial, usamos frequência,
   * mas somente entre anos que aparecem isoladamente como "20xx".
   */
  if (!ano && yearItems.length) {
    const freq = new Map();

    for (const y of yearItems) {
      freq.set(y.year,(freq.get(y.year) || 0)+1);
    }

    ano = [...freq.entries()]
      .sort((a,b) => b[1]-a[1])[0][0];
  }

  return {mi,ano};
}

/*
 * Leitura robusta da periodicidade.
 * Aceita nomes completos, plurais, "terça-feira", abreviações e 2ª/5ª.
 */
function extractPeriodDays(per) {
  let text = norm(per)
    .replace(/[–—−]/g,'-')
    .replace(/\bfeira(s)?\b/g,'')
    .replace(/[(),;]/g,' ');

  const days = [];
  const add = n => {
    if (!days.includes(n)) days.push(n);
  };

  const aliases = [
    [/\bdom(?:ingo|ingos)?\b/i,0],
    [/\bseg(?:unda|undas)?\b/i,1],
    [/\bter(?:ca|cas)\b/i,2],
    [/\bqua(?:rta|rtas)?\b/i,3],
    [/\bqui(?:nta|ntas)?\b/i,4],
    [/\bsex(?:ta|tas)?\b/i,5],
    [/\bsab(?:ado|ados)?\b/i,6]
  ];

  for (const [re,n] of aliases) {
    if (re.test(text)) add(n);
  }

  /* 1ª=domingo, 2ª=segunda, ..., 7ª=sábado. */
  for (const m of text.matchAll(/\b([1-7])\s*(?:ª|a|º)\b/gi)) {
    add(Number(m[1]) - 1);
  }

  /*
   * Alguns OCRs removem o símbolo ordinal e deixam "2 e 5".
   * Só aceitamos números nesse formato quando há contexto de periodicidade.
   */
  if (/\b(?:vez|vezes|semana|semanal|dias?)\b/i.test(text)) {
    for (const m of text.matchAll(/(?:^|[\s/,-])([1-7])(?:\s*(?:e|\/)\s*([1-7]))+/gi)) {
      add(Number(m[1]) - 1);
      if (m[2]) add(Number(m[2]) - 1);
    }
  }

  days.sort((a,b) => a-b);
  const q = text.match(/\b(\d+)\s*vez(?:es)?\b/i);

  return {
    days,
    frequency:q ? Number(q[1]) : null,
    text
  };
}

/*
 * Reconstrói o campo "Periodicidade" mesmo quando o OCR separa
 * o rótulo e o valor em linhas diferentes.
 */
function readPeriodicity(items, currentValue='') {
  const candidates = [];
  if (currentValue) candidates.push(currentValue);

  const labels = items.filter(i =>
    /^periodicidade\s*:?\s*$/i.test(String(i.s || '').trim())
  );

  for (const label of labels) {
    const nearby = items
      .filter(i => {
        if (i === label) return false;

        const dy = i.y - label.y;
        const dx = i.x - label.x;

        const sameLine = Math.abs(dy) <= 12 && dx > -5 && dx < 500;
        const below = dy > 0 && dy <= 42 && Math.abs(dx) < 500;

        return sameLine || below;
      })
      .sort((a,b) => {
        const da = Math.abs(a.y-label.y) + Math.max(0, label.x-a.x);
        const db = Math.abs(b.y-label.y) + Math.max(0, label.x-b.x);
        return da-db;
      });

    if (nearby.length) {
      candidates.push(nearby.slice(0,12).map(i => i.s).join(' '));
    }
  }

  /* Último recurso: texto integral do documento. */
  candidates.push(
    items.slice()
      .sort((a,b) => a.y-b.y || a.x-b.x)
      .map(i => i.s)
      .join(' ')
  );

  let best = {
    value:'',
    parsed:{days:[],frequency:null,text:''},
    score:-1
  };

  for (const value of candidates) {
    const parsed = extractPeriodDays(value);
    let score = parsed.days.length * 10;

    if (parsed.frequency != null) score += 3;
    if (/periodicidade/i.test(value)) score += 4;
    if (/\b(?:semana|semanal|vez|vezes)\b/i.test(parsed.text)) score += 2;

    if (score > best.score) {
      best = {value:value.trim(), parsed, score};
    }
  }

  return best;
}

function buildCalendar(year, monthIndex, periodicityDays) {
  const last = new Date(year, monthIndex + 1, 0).getDate();
  const dates = [];

  for (let day = 1; day <= last; day++) {
    const dt = new Date(year, monthIndex, day);
    const weekday = dt.getDay();

    dates.push({
      day,
      date: dt,
      weekday,
      weekdayName: NS[weekday],
      expected: periodicityDays.includes(weekday),
      key: `${year}-${String(monthIndex + 1).padStart(2,'0')}-${String(day).padStart(2,'0')}`
    });
  }

  return dates;
}

function formatDateBR(year, monthIndex, day) {
  return `${String(day).padStart(2,'0')}/${String(monthIndex + 1).padStart(2,'0')}/${year}`;
}

function detectHeaderDays(items, monthIndex, year) {
  /*
   * O cabeçalho da lista é uma representação visual do calendário.
   * Porém alguns modelos terminam com o primeiro dia do mês seguinte:
   *
   *   1 2 3 ... 29 30 1
   *
   * Portanto NÃO usamos a posição da coluna como se ela fosse a data.
   * Primeiro identificamos o número impresso e o transformamos em uma
   * data real do mês/ano. O último "1" fica fora porque já existe o
   * dia 1 do mês atual.
   */
  const maxDay = new Date(year, monthIndex + 1, 0).getDate();

  const nums = items
    .filter(i => /^\d{1,2}$/.test(String(i.s).trim()))
    .map(i => ({
      ...i,
      d: Number(String(i.s).trim()),
      cx: i.x + (i.w || 0) / 2
    }))
    .filter(i => i.d >= 1 && i.d <= maxDay);

  if (!nums.length) return [];

  const groups = new Map();

  nums.forEach(i => {
    const key = Math.round(i.y / 5) * 5;
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(i);
  });

  function scoreGroup(group) {
    const ordered = group.slice().sort((a,b) => a.cx-b.cx);

    /*
     * Para cada dia, guardamos somente a primeira ocorrência.
     * Isso é essencial para o padrão "... 29 30 1": o primeiro "1"
     * é junho/1 e o segundo "1" seria julho/1.
     */
    const byDay = new Map();

    for (const item of ordered) {
      if (!byDay.has(item.d)) byDay.set(item.d, item);
    }

    const days = [...byDay.keys()].sort((a,b) => a-b);

    if (days.length < Math.min(5, maxDay)) {
      return { score: -Infinity, group: [] };
    }

    let consecutive = 0;
    let longest = days.length ? 1 : 0;
    let current = days.length ? 1 : 0;

    for (let i = 1; i < days.length; i++) {
      if (days[i] === days[i-1] + 1) {
        consecutive++;
        current++;
        longest = Math.max(longest, current);
      } else {
        current = 1;
      }
    }

    const points = [...byDay.values()].sort((a,b) => a.cx-b.cx);

    let regularity = 0;
    if (points.length >= 3) {
      const gaps = [];
      for (let i = 1; i < points.length; i++) {
        const dx = points[i].cx - points[i-1].cx;
        if (dx > 0) gaps.push(dx);
      }

      if (gaps.length) {
        const avg = gaps.reduce((a,b) => a+b,0) / gaps.length;
        const variance =
          gaps.reduce((a,b) => a + Math.pow(b-avg,2),0) / gaps.length;
        const cv = avg ? Math.sqrt(variance) / avg : 1;
        regularity = Math.max(0, 25 - cv * 25);
      }
    }

    const startsAtOne = days[0] === 1 ? 40 : 0;
    const hasEnd = days.includes(maxDay) ? 25 : 0;

    const score =
      days.length * 12 +
      consecutive * 20 +
      longest * 18 +
      regularity +
      startsAtOne +
      hasEnd;

    return { score, group: points };
  }

  const ranked = [...groups.values()]
    .map(scoreGroup)
    .sort((a,b) => b.score-a.score);

  if (!ranked[0] || !ranked[0].group.length) return [];

  const chosen = ranked[0].group
    .filter(i => i.d >= 1 && i.d <= maxDay)
    .sort((a,b) => a.cx-b.cx);

  const seen = new Set();
  const out = [];

  for (const item of chosen) {
    if (seen.has(item.d)) continue;
    seen.add(item.d);

    out.push({
      ...item,
      day: item.d,
      date: new Date(year, monthIndex, item.d),
      key: `${year}-${String(monthIndex + 1).padStart(2,'0')}-${String(item.d).padStart(2,'0')}`
    });
  }

  return out;
}

function rowItems(items, y) {
  return items
    .filter(i => Math.abs(i.y-y) < 4)
    .sort((a,b) => a.x-b.x);
}

function analyze(items,dsig,ocr,img) {
  const C = [];
  const A = [];
  const I = {};

  const add = (t,m) => C.push({t,m});

  if (ocr) {
    add('wa','Leitura por OCR: o resultado é aproximado. Confira os apontamentos no arquivo original.');
  }

  const {mi,ano} = parseReference(items);
  const monthItem = items.find(i => MES.some(m => norm(m) === norm(i.s)));
  const CUT = monthItem ? monthItem.x : 1e9;

  I['Núcleo'] = val(items,/^(?:núcleo|nucleo):\s*(.*)$/i,0,CUT);
  I['Turma'] = val(items,/^turma:\s*(.*)$/i,0,CUT);
  const prof = val(items,/^professor:\s*(.*)$/i,0,CUT);
  const coord = val(items,/^coordenador:\s*(.*)$/i,0,CUT);

  I['Professor'] = prof;
  I['Coordenador'] = coord;
  I['Horário'] = val(items,/^hor(?:ário|ario):?\s*(.*)$/i,0,CUT);

  const periodicidadeLida = readPeriodicity(
    items,
    val(items,/^periodicidade:?\s*(.*)$/i,1,CUT)
  );

  I['Periodicidade'] = periodicidadeLida.value || '';

  if (mi == null || !ano) {
    return {
      C:[{t:'er',m:'Não encontrei o mês/ano de referência na lista.'}],
      I,A
    };
  }

  I['Mês'] = `${MES[mi]}/${ano}`;

  const {days:dias,frequency} = periodicidadeLida.parsed;

  if (!dias.length) {
    return {
      C:[{
        t:'er',
        m:`Não consegui identificar os dias da semana. O campo lido foi: "${I['Periodicidade'] || 'não lido'}". Formatos aceitos: terça e quinta, terça-feira e quinta-feira, ter/qui ou 2ª e 5ª.`
      }],
      I,A
    };
  }

  if (frequency != null && frequency !== dias.length) {
    add(
      'er',
      `Periodicidade inconsistente: informa ${frequency} vez(es) por semana, mas a lista contém ${dias.length} dia(s).`
    );
  } else {
    add(
      'ok',
      `Periodicidade lida: ${dias.map(d => NS[d]).join(' e ')}.` +
      (frequency != null ? ` Frequência informada: ${frequency} vez(es)/semana.` : '')
    );
  }

  const dim = new Date(ano,mi+1,0).getDate();
  const aula = [];

  for (let d=1; d<=dim; d++) {
    if (dias.includes(new Date(ano,mi,d).getDay())) aula.push(d);
  }

  add(
    'ok',
    `Dias de aula em ${I['Mês']}: ${aula.join(', ')} (${aula.length} aulas)`
  );

  /* Assinaturas */
  const ts = items
    .filter(i => /^data:\s*\d{2}\/\d{2}\/\d{4}/i.test(i.s))
    .map(d => {
      const n = items
        .filter(i =>
          Math.abs(i.x-d.x) < 18 &&
          i.y > d.y+3 &&
          i.y < d.y+32 &&
          !/documento|assinad|data:|verifique/i.test(i.s)
        )
        .sort((a,b) => a.y-b.y)[0];

      return {
        nome:n ? n.s : '?',
        data:d.s.slice(6,16)
      };
    })
    .filter(x => x.nome !== '?');

  const sig = dsig && dsig.length ? dsig : ts;

  if (img) {
    add(
      'wa',
      'Arquivo em imagem: assinaturas digitais não podem ser verificadas com segurança. Confira instrutor e coordenador no original.'
    );
  } else if (!sig.length) {
    add('wa','Nenhuma assinatura digital (gov.br) identificável foi encontrada no PDF.');
  } else {
    add(
      'ok',
      `Assinaturas digitais encontradas (${sig.length}): ` +
      sig.map(x => x.nome + (x.data ? ` em ${x.data}` : '')).join('; ')
    );

    const has = n => sig.some(s => {
      const a = norm(s.nome);
      const b = norm(n);
      return b && (a === b || a.includes(b) || b.includes(a));
    });

    [['Instrutor',prof],['Coordenador',coord]].forEach(([r,n]) => {
      if (!n) {
        add('wa',`${r} não foi lido no cabeçalho.`);
      } else if (has(n)) {
        add('ok',`${r} assinou: ${n}`);
      } else {
        add(
          'er',
          `${r} do cabeçalho (${n}) não consta entre os signatários identificados.`
        );
      }
    });

    const out = sig.filter(s =>
      ![prof,coord].some(n =>
        n &&
        (
          norm(s.nome).includes(norm(n)) ||
          norm(n).includes(norm(s.nome))
        )
      )
    );

    if (out.length) {
      add(
        'wa',
        'Outros signatários não conferidos: ' +
        out.map(s => s.nome + (s.data ? ` em ${s.data}` : '')).join('; ')
      );
    }
  }

  /* ================================================================
   * GRADE DE PRESENÇA — MOTOR ORIENTADO POR DATA
   * ================================================================
   *
   * A regra principal agora é:
   *
   *   1) mês + ano -> calendário real;
   *   2) periodicidade -> datas previstas;
   *   3) cabeçalho da lista -> número do dia;
   *   4) P/A -> procura a DATA mais próxima, não "a coluna N";
   *   5) toda conferência é feita usando a data completa (dd/mm/aaaa).
   *
   * Assim, se uma coluna estiver vazia, houver uma coluna extra ou o
   * modelo terminar com "1" do mês seguinte, a data não é deslocada.
   */

  const calendario = buildCalendar(ano, mi, dias);
  const previstas = calendario.filter(x => x.expected);
  const hdr = detectHeaderDays(items, mi, ano);

  if (!hdr.length || hdr.length < Math.min(10, dim)) {
    add(
      'er',
      'Não encontrei o calendário diário completo da lista. O sistema precisa localizar os números das datas no cabeçalho antes de conferir P/A.'
    );
    return {C,I,A};
  }

  /*
   * Mapa de DATA -> posição X.
   * A chave é a data real, e não o índice da coluna.
   */
  const posData = new Map();

  for (const h of hdr) {
    if (!posData.has(h.key)) {
      posData.set(h.key, h.x + h.w/2);
    }
  }

  const datasCabecalho = [...posData.keys()]
    .map(k => calendario.find(d => d.key === k))
    .filter(Boolean);

  if (datasCabecalho.length < 5) {
    add(
      'er',
      'O calendário foi localizado, mas poucas datas puderam ser vinculadas ao mês/ano da lista.'
    );
    return {C,I,A};
  }

  /*
   * Espaçamento mediano entre as datas do cabeçalho.
   * É usado somente para decidir se um P/A pertence a uma célula.
   * A identidade da data continua vindo do calendário.
   */
  const xList = datasCabecalho
    .map(d => posData.get(d.key))
    .sort((a,b) => a-b);

  const xGaps = [];
  for (let i = 1; i < xList.length; i++) {
    const g = xList[i] - xList[i-1];
    if (g > 0) xGaps.push(g);
  }

  xGaps.sort((a,b) => a-b);
  const sp = xGaps.length
    ? xGaps[Math.floor(xGaps.length/2)]
    : 0;

  if (!Number.isFinite(sp) || sp <= 0) {
    add('er','Não foi possível determinar o espaçamento real das células de data.');
    return {C,I,A};
  }

  const hy = Math.max(...hdr.map(i => i.y));

  /*
   * Localiza uma marcação e devolve a DATA, não o número da coluna.
   */
  function dataMaisProxima(xCenter) {
    let melhor = null;
    let distancia = Infinity;

    for (const d of datasCabecalho) {
      const x = posData.get(d.key);
      const dx = Math.abs(x - xCenter);

      if (dx < distancia) {
        distancia = dx;
        melhor = d;
      }
    }

    /*
     * Uma célula normalmente fica dentro de aproximadamente metade do
     * espaçamento da coluna. Uma tolerância um pouco maior é necessária
     * em OCR, mas nunca aceitamos uma marcação muito distante.
     */
    const limite = sp * (ocr ? 0.72 : 0.58);

    return melhor && distancia <= limite
      ? {data:melhor, distancia}
      : null;
  }

  /*
   * Interpretação das linhas de alunos.
   * Mantemos a lógica geométrica apenas para descobrir qual linha é de
   * qual aluno. A associação P/A -> data é feita pelo calendário.
   */
  const body = items
    .filter(i => i.y < hy-3)
    .sort((a,b) => b.y-a.y);

  const rows = [];

  body.forEach(i => {
    const r = rows[rows.length-1];

    if (r && Math.abs(r.y-i.y) < 4) {
      r.it.push(i);
    } else {
      rows.push({y:i.y,it:[i]});
    }
  });

  rows.forEach(r => {
    const nome = r.it
      .filter(i =>
        i.x < (Math.min(...xList) - sp*0.35) &&
        !/^\d+$/.test(i.s) &&
        /[A-Za-zÀ-ÿ]/.test(i.s) &&
        !BAD.test(i.s)
      )
      .sort((a,b) => a.x-b.x)
      .map(i => i.s.replace(/^\d+\s*[-–—]?\s*/,''))
      .join(' ')
      .trim();

    if (!nome) return;

    const mk = {};
    const inv = [];
    const erros = [];

    r.it.forEach(i => {
      const c = i.x + i.w/2;
      const t = i.s.toUpperCase().trim();

      /*
       * Só P/A/"-" entram na conferência de presença.
       * Primeiro identificamos a data pelo calendário.
       */
      if (!/^[PA]$|^[-–—_]$/.test(t)) {
        if (!ocr && t.length <= 3 && /[A-Z]/.test(t)) {
          const found = dataMaisProxima(c);
          if (found) {
            inv.push(
              `${formatDateBR(ano,mi,found.data.day)} ("${i.s}")`
            );
          }
        }
        return;
      }

      const found = dataMaisProxima(c);

      if (!found) return;

      const key = found.data.key;

      if (/^[PA]$/.test(t)) {
        mk[key] = {
          status:t,
          day:found.data.day,
          date:found.data.date,
          key
        };
      } else {
        mk[key] = {
          status:'-',
          day:found.data.day,
          date:found.data.date,
          key
        };
      }
    });

    /*
     * Dias previstos pelo calendário que realmente possuem algum P/A.
     */
    const datasComRegistro = Object.values(mk)
      .filter(v => v.status === 'P' || v.status === 'A')
      .map(v => v.day)
      .sort((a,b) => a-b);

    const previstasSemRegistro = previstas
      .filter(d => !mk[d.key])
      .map(d => d.day);

    const foraDoCalendario = Object.values(mk)
      .filter(v => !previstas.some(d => d.key === v.key) && v.status !== '-')
      .map(v => v.day)
      .sort((a,b) => a-b);

    if (!Object.keys(mk).length) {
      erros.push('sem nenhum registro de presença identificado');
    }

    /*
     * Aqui está a mudança principal:
     * não comparamos "quantidade de colunas" com "quantidade de aulas".
     * Comparamos DATA prevista x DATA encontrada.
     */
    /*
     * Não marcamos automaticamente cada aluno como erro quando uma data
     * prevista está sem qualquer registro na lista inteira. Isso pode
     * representar cancelamento, feriado ou ausência de aula naquele dia.
     * A ocorrência é tratada no resumo global.
     */

    if (foraDoCalendario.length) {
      erros.push(
        'marcação em data que não corresponde à periodicidade: ' +
        foraDoCalendario.map(d => formatDateBR(ano,mi,d)).join(', ')
      );
    }

    if (inv.length) {
      erros.push(
        'caractere inválido (use P ou A): ' + inv.join(', ')
      );
    }

    /*
     * Totais impressos.
     * Eles ficam depois da grade e são lidos somente como números fora
     * da faixa de datas; portanto não interferem na identificação das
     * datas.
     */
    const maxXData = Math.max(...xList);
    const nums = r.it
      .filter(i =>
        i.x+i.w/2 > maxXData + sp*0.45 &&
        /^\d+$/.test(i.s)
      )
      .sort((a,b) => a.x-b.x)
      .map(i => Number(i.s));

    const cA = Object.values(mk).filter(v => v.status === 'A').length;
    const cP = Object.values(mk).filter(v => v.status === 'P').length;
    const cDash = Object.values(mk).filter(v => v.status === '-').length;

    if (
      nums.length >= 2 &&
      (nums[0] !== cA || nums[1] !== cP)
    ) {
      erros.push(
        `totais impressos (A ${nums[0]} / P ${nums[1]}) diferem do contado (A ${cA} / P ${cP})`
      );
    }

    if (!Object.keys(mk).length) return;

    A.push({
      nome,
      erros,
      p:cP,
      a:cA,
      dash:cDash,
      blank:previstasSemRegistro.length,
      mk
    });
  });

  /*
   * Resumo global baseado no CALENDÁRIO, não na posição das colunas.
   */
  const registroGlobal = new Map();

  for (const aluno of A) {
    for (const v of Object.values(aluno.mk)) {
      const key = v.key;

      if (!registroGlobal.has(key)) {
        registroGlobal.set(key, []);
      }

      registroGlobal.get(key).push(v.status);
    }
  }

  const datasComPresenca = [...registroGlobal.keys()]
    .map(k => calendario.find(d => d.key === k))
    .filter(Boolean)
    .sort((a,b) => a.day-b.day);

  const datasPrevistasSemRegistroGlobal = previstas.filter(d =>
    !registroGlobal.has(d.key)
  );

  add(
    'ok',
    'Calendário de ' + MES[mi] + '/' + ano + ': ' +
    previstas.map(d => formatDateBR(ano,mi,d.day)).join(', ')
  );

  add(
    datasComPresenca.length
      ? 'ok'
      : 'er',
    'Datas que possuem P/A na lista: ' +
    (datasComPresenca.length
      ? datasComPresenca.map(d => formatDateBR(ano,mi,d.day)).join(', ')
      : 'nenhuma')
  );

  if (datasPrevistasSemRegistroGlobal.length) {
    add(
      'wa',
      'Datas previstas pelo calendário sem P/A registrado: ' +
      datasPrevistasSemRegistroGlobal
        .map(d => formatDateBR(ano,mi,d.day))
        .join(', ') +
      '. O sistema NÃO desloca essas marcações para outra coluna.'
    );
  } else {
    add('ok','Todas as datas previstas pelo calendário possuem registro P/A.');
  }

  if (!A.length) {
    add('er','Não encontrei alunos/registros de presença na grade.');
  } else {
    /*
     * "Dias previstos em branco" só deve considerar ausência de P/A.
     * Um "-" em toda a lista é tratado como dia sem aula.
     */
    const dsh = previstas.filter(d =>
      A.length > 0 &&
      A.every(x => x.mk[d.key]?.status === '-')
    );

    const bln = previstas.filter(d =>
      A.some(x => !x.mk[d.key])
    );

    const mis = previstas.filter(d =>
      A.some(x => x.mk[d.key]?.status === '-') &&
      A.some(x =>
        x.mk[d.key]?.status === 'P' ||
        x.mk[d.key]?.status === 'A'
      )
    );

    const lst = a => a.length
      ? ' (' + a.map(d => formatDateBR(ano,mi,d.day)).join(', ') + ')'
      : '';

    add(
      'ok',
      'Datas previstas marcadas com "-" para todos: ' +
      dsh.length + lst(dsh)
    );

    /*
     * "Em branco" agora significa exatamente:
     * a data estava prevista no calendário, mas não existe P/A para
     * nenhum aluno naquela data.
     */
    add(
      bln.length ? 'wa' : 'ok',
      'Datas previstas sem P/A para algum aluno: ' +
      bln.length + lst(bln)
    );

    if (mis.length) {
      add(
        'wa',
        'Data(s) com "-" para alguns alunos e P/A para outros: ' +
        mis.map(d => formatDateBR(ano,mi,d)).join(', ')
      );
    }
  }

  return {
    C,
    I,
    A,
    calendario,
    previstas,
    referencia: {mes: mi, ano}
  };
}


function weekdayShort(n) {
  return ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'][n];
}

function dateBRFromKey(key) {
  const m = String(key || '').match(/^(\d{4})-(\d{2})-(\d{2})$/);
  return m ? `${m[3]}/${m[2]}/${m[1]}` : key;
}

function calendarEvidence(r) {
  const alunos = r.A || [];
  const previstas = r.previstas || [];
  const calendario = r.calendario || [];

  if (!previstas.length) return '';

  const rows = previstas.map(d => {
    const vals = alunos
      .map(a => a.mk?.[d.key]?.status || '')
      .filter(Boolean);

    const p = vals.filter(v => v === 'P').length;
    const a = vals.filter(v => v === 'A').length;
    const dash = vals.filter(v => v === '-').length;
    const blank = Math.max(0, alunos.length - vals.length);

    let status = 'ok';
    let label = 'Registrada';

    if (!alunos.length) {
      status = 'wa';
      label = 'Sem alunos identificados';
    } else if (blank === alunos.length) {
      status = 'er';
      label = 'Sem P/A';
    } else if (blank > 0) {
      status = 'wa';
      label = 'Parcial';
    } else if (dash === alunos.length) {
      status = 'wa';
      label = '“-” para todos';
    }

    return `
      <tr>
        <td><b>${esc(formatDateBR(r.referencia.ano,r.referencia.mes,d.day))}</b></td>
        <td>${weekdayShort(d.weekday)}</td>
        <td><span class="pill expected">SIM</span></td>
        <td>${p}</td>
        <td>${a}</td>
        <td>${dash}</td>
        <td>${blank}</td>
        <td><span class="pill ${status}">${label}</span></td>
      </tr>`;
  }).join('');

  return `
    <div class="sec calendar-sec">
      <h3>Calendário real usado na conferência</h3>
      <p class="date-note">
        As datas abaixo foram calculadas a partir de <b>${esc(MES[r.referencia.mes])}/${r.referencia.ano}</b>
        e da periodicidade da lista. A posição da coluna não define a data.
      </p>
      <div class="table-wrap">
        <table class="calendar-table">
          <thead>
            <tr>
              <th>Data</th>
              <th>Dia</th>
              <th>Prevista</th>
              <th>P</th>
              <th>A</th>
              <th>-</th>
              <th>Em branco</th>
              <th>Situação</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    </div>`;
}

function studentMatrix(r) {
  const alunos = r.A || [];
  const previstas = r.previstas || [];

  if (!alunos.length || !previstas.length) return '';

  const head = previstas.map(d =>
    `<th title="${esc(formatDateBR(r.referencia.ano,r.referencia.mes,d.day))}">
      ${String(d.day).padStart(2,'0')}<small>${weekdayShort(d.weekday)}</small>
    </th>`
  ).join('');

  const body = alunos.map(a => {
    const cells = previstas.map(d => {
      const v = a.mk?.[d.key];
      const st = v?.status || '';
      const cls = st === 'P' ? 'present'
        : st === 'A' ? 'absent'
        : st === '-' ? 'dash'
        : 'blank';

      return `<td class="${cls}" title="${esc(formatDateBR(r.referencia.ano,r.referencia.mes,d.day))}">
        ${st || '·'}
      </td>`;
    }).join('');

    return `<tr>
      <th class="student-name">${esc(a.nome)}</th>
      ${cells}
      <td class="student-total">${a.p}/${a.a}</td>
    </tr>`;
  }).join('');

  return `
    <div class="sec">
      <h3>Matriz de conferência por aluno</h3>
      <p class="date-note">
        <b>P</b> = presença · <b>A</b> = ausência · <b>-</b> = marcado como sem aula ·
        <b>·</b> = nenhuma marcação encontrada para aquela data.
      </p>
      <div class="table-wrap">
        <table class="matrix">
          <thead>
            <tr>
              <th class="student-name">Aluno</th>
              ${head}
              <th>Total<br>P/A</th>
            </tr>
          </thead>
          <tbody>${body}</tbody>
        </table>
      </div>
    </div>`;
}

function render(name,r) {

  const bad =
    r.C.some(c => c.t === 'er') ||
    r.A.some(a => a.erros.length);

  const warn = r.C.some(c => c.t === 'wa');

  const st = bad
    ? ['er','Com erros']
    : warn
      ? ['wa','Correta, com avisos']
      : ['ok','Correta'];

  const nErr = r.A.filter(a => a.erros.length).length;

  let h =
    '<div class="card">' +
      '<div class="hd">' +
        '<h2>' + esc(name) + '</h2>' +
        '<span class="bg ' + st[0] + '">' + st[1] + '</span>' +
        '<dl>' +
          Object.entries(r.I)
            .filter(([,v]) => v)
            .map(([k,v]) =>
              '<dt>' + esc(k) + '</dt><dd>' + esc(v) + '</dd>'
            ).join('') +
        '</dl>' +
      '</div>';

  h +=
    '<div class="sec">' +
      '<h3>Resumo da lista</h3>' +
      '<ul>' +
        r.C.map(c =>
          '<li class="' + c.t + '">' + esc(c.m) + '</li>'
        ).join('') +
      '</ul>' +
    '</div>';

  if (r.A.length) {
    h +=
      '<div class="sec">' +
        '<h3>Alunos (' + r.A.length + ' lidos, ' + nErr + ' com problema)</h3>' +
        '<ul>' +
          r.A.map(a =>
            '<li class="' + (a.erros.length ? 'er' : 'ok') + '">' +
              '<b>' + esc(a.nome) + '</b>: ' +
              'Presenças ' + a.p +
              ' · Ausências ' + a.a +
              ' · Sem aula (-) ' + a.dash +
              ' · Em branco ' + a.blank +
              (a.erros.length
                ? '<br>' + esc(a.erros.join('; '))
                : '') +
            '</li>'
          ).join('') +
        '</ul>' +
      '</div>';
  }

  h += calendarEvidence(r);
  h += studentMatrix(r);

  h +=
    '<div class="sec">' +
      '<span class="small">A conferência automática é uma ferramenta de apoio. OCR e identificação de assinaturas podem exigir conferência manual.</span>' +
    '</div>' +
    '</div>';

  return h;
}

async function run(files) {
  const out = document.getElementById('out');
  out.innerHTML = '';

  if (!files.length) return;

  for (const f of files) {
    const box = document.createElement('div');
    out.appendChild(box);

    try {
      const isPdf =
        /pdf$/i.test(f.type) ||
        /\.pdf$/i.test(f.name);

      const isImage = /^image\//i.test(f.type);

      if (!isPdf && !isImage) {
        throw new Error(
          'Formato não suportado. Envie PDF ou imagem (PNG/JPG).'
        );
      }

      box.innerHTML =
        '<div class="card">' +
          '<div class="hd">' +
            '<h2>' + esc(f.name) + '</h2>' +
            'Lendo o arquivo… imagens podem levar algum tempo.' +
            '<div class="progress"><span></span></div>' +
          '</div>' +
        '</div>';

      const progress = box.querySelector('.progress span');

      if (progress) progress.style.width = '10%';

      const result = await extract(f);

      if (progress) progress.style.width = '70%';

      if (!result.items.length) {
        throw new Error(
          'Não consegui ler texto neste arquivo. Envie uma imagem mais nítida ou um PDF gerado da planilha.'
        );
      }

      const analyzed = analyze(
        result.items,
        result.sigs,
        result.ocr,
        result.img
      );

      if (progress) progress.style.width = '100%';

      box.innerHTML = render(f.name,analyzed);

    } catch(e) {
      box.innerHTML =
        '<div class="card">' +
          '<div class="hd">' +
            '<h2>' + esc(f.name) + '</h2>' +
            '<span class="bg er">Não foi possível ler</span>' +
            '<p>' + esc(e && e.message ? e.message : 'Erro desconhecido.') + '</p>' +
          '</div>' +
        '</div>';
    }
  }
}

const fi = document.getElementById('f');

fi.addEventListener('change', () => {
  run([...fi.files]);
});

const dz = document.querySelector('.dz');

dz.addEventListener('dragover', e => {
  e.preventDefault();
  dz.style.opacity = '.8';
});

dz.addEventListener('dragleave', () => {
  dz.style.opacity = '1';
});

dz.addEventListener('drop', e => {
  e.preventDefault();
  dz.style.opacity = '1';
  run([...e.dataTransfer.files]);
});
</script>
